<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Inter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bangers&family=Bebas+Neue&family=Caveat:wght@400;700&family=DM+Serif+Display&family=Geist:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600&family=Lobster&family=Montserrat:wght@400;700&family=Oswald:wght@400;600&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:wght@400;700&family=Righteous&family=Rubik+Mono+One&family=Space+Mono:wght@400;700&family=Staatliches&display=swap">
<!-- Official Lucide package (lucide.dev): <i data-lucide="name"> + lucide.createIcons() -->
<script src="https://cdn.jsdelivr.net/npm/lucide@1.19.0/dist/umd/lucide.min.js"></script>
<style>
  /* Layout: slim sidebar on the left; right of it the editor panel (flexible) and a Shorts-format preview panel (fixed 360px).
     Grid: 4/8px. Controls 36px, radius 8px, panels 12px. Icons 18px, navigation 20px, stroke 1.75.
     Type: Geist Sans throughout; the ranking title keeps Archivo Black. Page title 20/600, card title 15/600, controls 13-14/500.
     One deliberate dark look, as in the reference screenshot. */
  :root {
    color-scheme: dark;
    --bg: #0b0c0e;
    --panel: #121318;
    --raised: #181a20;
    --hover: #1d1f26;
    --line: #272a32;
    --line-strong: #3a3e48;
    --ink: #f5f5f5;
    --muted: #8d919c;
    --select: rgba(255, 255, 255, .12);
    --editor: #000000;
    --canvas: #000000;
    --sel: rgba(255, 255, 255, .22);
    --r-ctl: 8px;
    --r-panel: 12px;
    --t: 150ms;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --spring: cubic-bezier(.34, 1.45, .5, 1);
    --ease: cubic-bezier(.3, .7, .2, 1);
    --side-t: 340ms;
    --side-ease: cubic-bezier(.45, .05, .2, 1);
    --f-ui: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; scrollbar-width: none; -webkit-tap-highlight-color: transparent; }
  *::-webkit-scrollbar { display: none; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-ui);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    /* Nothing can be selected or copied except inside input fields */
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  input, .editor { -webkit-user-select: text; user-select: text; caret-color: var(--ink); }
  /* Theme-matched selection instead of the system blue */
  ::selection, input::selection, .editor::selection, .editor *::selection { background: var(--sel); color: inherit; }
  ::highlight(inter-sel) { background-color: var(--sel); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  svg.lucide { width: 18px; height: 18px; flex: none; }

  .app { display: flex; height: 100%; }

  @keyframes appIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes itemIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }

  /* ---------- Tooltips ---------- */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip);
    position: absolute; left: 50%; bottom: calc(100% + 8px); z-index: 60;
    transform: translate(-50%, 3px);
    padding: 5px 8px; border-radius: 6px; background: var(--ink); color: var(--bg);
    font-size: 12px; font-weight: 500; line-height: 1.2; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 120ms ease, transform 120ms var(--ease);
  }
  [data-tip][data-tip-pos="right"]::after { left: calc(100% + 8px); bottom: auto; top: 50%; transform: translate(-3px, -50%); }
  [data-tip][aria-expanded="true"]::after, [data-tip].dragging::after { display: none; }
  @media (hover: hover) {
    [data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 300ms; }
    [data-tip][data-tip-pos="right"]:hover::after, [data-tip][data-tip-pos="right"]:focus-visible::after { transform: translate(0, -50%); }
  }
  .side:not(.collapsed) .tab::after, .side:not(.collapsed) .foot-btn::after { display: none; }

  /* ---------- Sidebar ----------
     Icons sit at the same x position in both states (centre 20px), so nothing jumps when the menu collapses. */
  .side {
    width: 184px; flex: none; display: flex; flex-direction: column; gap: 20px;
    padding: 32px 11px 16px 0; border-right: 1px solid var(--line);
    transition: width var(--side-t) var(--side-ease);
  }
  .side.collapsed { width: 52px; }
  .brand { display: flex; align-items: center; height: 36px; }
  .logo {
    display: flex; align-items: center; flex: none; height: 36px; padding: 0 0 0 9px; color: var(--ink);
    font-family: var(--f-ui); font-size: 18px; font-weight: 600; letter-spacing: -.03em; line-height: 1; white-space: nowrap;
  }
  .logo img { width: 22px; height: 22px; flex: none; display: block; }
  .wordmark {
    display: inline-block; max-width: 80px; margin-left: 9px; overflow: hidden;
    transition: opacity 240ms ease, max-width var(--side-t) var(--side-ease), margin var(--side-t) var(--side-ease), transform var(--side-t) var(--side-ease);
  }
  /* Collapsed: only the centred logo remains */
  .side.collapsed .wordmark { opacity: 0; max-width: 0; margin-left: 0; transform: translateX(-6px); }

  .nav { position: relative; display: flex; flex-direction: column; gap: 2px; }
  .nav-ind {
    position: absolute; left: 0; top: 0; width: 2px; height: 16px; border-radius: 2px; background: var(--ink);
    transform: translateY(10px); transition: transform var(--side-t) var(--side-ease); pointer-events: none;
  }
  .tab, .foot-btn {
    display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 0 0 11px; white-space: nowrap;
    border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--muted); text-align: left;
    font-size: 13px; font-weight: 500;
    transition: background var(--t) ease, color var(--t) ease, gap var(--side-t) var(--side-ease), transform 100ms ease;
  }
  .tab svg.lucide, .foot-btn svg.lucide { width: 18px; height: 18px; }
  .tab:hover, .foot-btn:hover { background: var(--panel); color: var(--ink); }
  .tab:active, .foot-btn:active { transform: scale(.98); }
  .tab[aria-current="page"] { background: var(--raised); color: var(--ink); }
  .tab span, .foot-btn .lbl { display: inline-block; max-width: 100px; overflow: hidden; transition: opacity 240ms ease, transform var(--side-t) var(--side-ease), max-width var(--side-t) var(--side-ease); }
  .side.collapsed .tab, .side.collapsed .foot-btn { gap: 0; }
  .side.collapsed .tab span, .side.collapsed .foot-btn .lbl { opacity: 0; max-width: 0; transform: translateX(-6px); }

  /* Collapse button: always at the very bottom of the sidebar; the two icons cross-fade */
  .foot-btn { margin-top: auto; width: 100%; }
  .foot-btn .ico { position: relative; width: 18px; height: 18px; flex: none; }
  .foot-btn .ico svg { position: absolute; inset: 0; transition: opacity 240ms ease, transform var(--side-t) var(--ease-out); }
  .foot-btn .ic-open { opacity: 0; transform: translateX(-4px); }
  .side.collapsed .foot-btn .ic-close { opacity: 0; transform: translateX(4px); }
  .side.collapsed .foot-btn .ic-open { opacity: 1; transform: none; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; overflow: auto; padding: 32px 0 48px 32px; animation: appIn 520ms var(--side-ease) backwards; }
  .head h1 { margin: 0; height: 36px; display: flex; align-items: center; font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
  .cols {
    display: grid; grid-template-columns: minmax(0, 1fr) 360px;
    gap: 24px; align-items: start; margin-top: 28px;
  }
  @media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr); } .preview { position: static; } }
  @media (max-width: 720px) { .main { padding-left: 20px; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-panel); min-width: 0; }
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    height: 52px; padding: 0 20px; border-bottom: 1px solid var(--line);
    font-size: 14px; font-weight: 600; letter-spacing: -.01em;
  }
  .tag { padding: 2px 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .body { padding: 20px; }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  /* ---------- Custom switch ---------- */
  .switch {
    position: relative; flex: none; width: 40px; height: 24px; padding: 0;
    border: 1px solid var(--line-strong); border-radius: 999px; background: var(--hover);
    transition: background 360ms var(--ease-out), border-color 360ms var(--ease-out), transform 120ms ease;
  }
  .switch:hover { border-color: var(--muted); }
  .switch .knob {
    position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted);
    transition: transform 460ms var(--spring), width 240ms var(--ease-out), background 360ms var(--ease-out);
  }
  .switch[aria-checked="true"] { background: var(--ink); border-color: var(--ink); }
  .switch[aria-checked="true"] .knob { transform: translateX(16px); background: var(--bg); }
  .switch:active .knob { width: 22px; }
  .switch[aria-checked="true"]:active .knob { transform: translateX(12px); }

  /* ---------- Caption panel: the body glides open and closed ---------- */
  .panel .bar { transition: border-color 360ms var(--ease-out); }
  .panel:not(.open) > .bar { border-bottom-color: transparent; }
  .stack { position: relative; }
  .bar-lbl { flex: 1; cursor: pointer; }
  .panel:not(.on) .bar-lbl { cursor: default; }
  .bar-ctl { display: flex; align-items: center; gap: 10px; }
  .fold-btn { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; transition: background var(--t) ease, color var(--t) ease, opacity var(--t) ease; }
  .fold-btn:hover { background: var(--hover); color: var(--ink); }
  .fold-btn svg.lucide { transition: transform var(--side-t) var(--side-ease); }
  .panel.open > .bar .fold-btn svg.lucide { transform: rotate(180deg); }
  .panel:not(.on) .fold-btn { opacity: .3; pointer-events: none; }
  .panel.open.settled > .collapse > .collapse-in { overflow: visible; }
  .collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 520ms var(--ease-out); }
  .panel.open > .collapse { grid-template-rows: 1fr; }
  .collapse-in { min-height: 0; overflow: hidden; }
  .collapse-in > .body { opacity: 0; transform: translateY(-8px); transition: opacity 300ms ease, transform 520ms var(--ease-out); }
  .panel.open > .collapse > .collapse-in > .body { opacity: 1; transform: none; transition-delay: 90ms; }
  .field {
    width: 100%; height: 40px; padding: 0 14px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--editor);
    font-family: 'Archivo Black', sans-serif; font-size: 14px; color: var(--ink); outline: none;
    transition: border-color var(--t) ease, box-shadow var(--t) ease;
  }
  .field::placeholder { color: var(--ink); opacity: .35; }
  .field:hover { border-color: var(--line-strong); }
  .field:focus { border-color: var(--muted); box-shadow: 0 0 0 3px rgba(255, 255, 255, .06); }
  .opts { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; margin-top: 16px; }
  .opt { display: flex; align-items: center; gap: 10px; }
  .opt .lbl { color: var(--muted); font-size: 13px; font-weight: 500; }

  /* ---------- Toolbar ---------- */
  .tools { position: relative; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .grp { position: relative; display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .grp .ctl { border-color: transparent; background: transparent; height: 30px; min-width: 30px; width: 30px; border-radius: 7px; }
  .grp .ctl:hover { background: var(--hover); }
  .grp .ctl[aria-pressed="true"] { background: var(--select); }
  /* Segmented control: one indicator glides between the options */
  .seg-ind {
    position: absolute; left: 2px; top: 2px; width: 30px; height: 30px; border-radius: 7px;
    background: var(--select); pointer-events: none;
    transition: transform 460ms var(--ease-out);
  }
  .seg .ctl { position: relative; z-index: 1; }
  .seg .ctl[aria-pressed="true"] { background: transparent; }
  .seg .ctl:hover { background: rgba(255, 255, 255, .05); }

  .ctl {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 36px; min-width: 36px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--bg); color: var(--ink);
    font-size: 13px; font-weight: 500;
    transition: background var(--t) ease, color var(--t) ease, border-color var(--t) ease, opacity var(--t) ease, transform 100ms ease;
  }
  .ctl:hover { background: var(--hover); border-color: var(--line-strong); }
  .ctl:active { transform: scale(.96); }
  .ctl[aria-pressed="true"], .ctl[aria-expanded="true"] { background: var(--select); border-color: var(--line-strong); }
  .ctl:disabled { opacity: .35; cursor: default; pointer-events: none; }
  .sq { width: 36px; padding: 0; }
  /* Colour buttons show the current colour as a small bar under the icon */
  .color-btn { position: relative; }
  .color-btn svg.lucide { width: 16px; height: 16px; }
  .color-btn::before {
    content: ""; position: absolute; left: 50%; bottom: 4px; width: 14px; height: 3px; margin-left: -7px; border-radius: 2px;
    background: var(--sw, #fff); box-shadow: 0 0 0 1px rgba(255, 255, 255, .22);
  }
  .grp .color-btn::before { bottom: 2px; }

  .dd { position: relative; }
  .dd-btn { width: 176px; justify-content: space-between; text-align: left; }
  .dd-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .chev { transition: transform var(--side-t) var(--side-ease); color: var(--muted); }
  .dd-btn[aria-expanded="true"] { border-color: var(--line-strong); background: var(--hover); }
  .dd-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .menu {
    position: absolute; z-index: 30; top: calc(100% + 6px); left: 0;
    padding: 4px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
    opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-6px) scale(.97); transform-origin: top left;
    transition: opacity 240ms ease, transform var(--side-t) var(--side-ease), visibility 0s linear var(--side-t);
  }
  .menu.open { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition-delay: 0s; }
  /* Entries fade in one after another when a menu opens */
  .menu.open > .dd-item, .menu.open > button { animation: itemIn var(--side-t) var(--side-ease) backwards; animation-delay: calc(var(--i, 0) * 14ms); }
  .dd-panel { width: 240px; max-height: 288px; overflow-y: auto; }
  .dd-item {
    display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent;
    text-align: left; font-size: 16px; line-height: 1.2; white-space: nowrap;
    transition: background 120ms ease;
  }
  .dd-item:hover { background: var(--hover); }
  .dd-item[aria-selected="true"] { background: var(--select); }
  .dd-item svg.lucide { width: 16px; height: 16px; opacity: 0; color: var(--ink); transition: opacity 200ms ease; }
  .dd-item[aria-selected="true"] svg.lucide { opacity: 1; }

  .size {
    display: inline-flex; align-items: center; height: 36px; padding: 0 4px 0 10px; gap: 2px;
    border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--bg);
    transition: border-color var(--t) ease, background var(--t) ease;
  }
  .size:hover { border-color: var(--line-strong); background: var(--hover); }
  .size:focus-within { border-color: var(--ink); background: var(--bg); }
  .size input {
    width: 34px; border: 0; background: transparent; text-align: right; outline: none; font-size: 13px; font-weight: 500;
    -moz-appearance: textfield; font-variant-numeric: tabular-nums;
  }
  .size input::-webkit-outer-spin-button, .size input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .size .unit { color: var(--muted); font-size: 13px; margin-right: 2px; }
  .stepper { display: flex; flex-direction: column; }
  .step {
    width: 20px; height: 15px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    transition: background 120ms ease, color 120ms ease, transform 100ms ease;
  }
  .step svg.lucide { width: 12px; height: 12px; }
  .step:hover { background: var(--select); color: var(--ink); }
  .step:active { transform: scale(.88); }

  /* Custom slider for the stroke width */
  .slider-ctl {
    display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 10px;
    border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--bg); color: var(--muted);
    transition: border-color var(--t) ease, background var(--t) ease;
  }
  .slider-ctl:hover { border-color: var(--line-strong); background: var(--hover); }
  .slider { --f: 0; position: relative; width: 84px; height: 24px; cursor: pointer; touch-action: none; outline: none; }
  .s-track { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--line-strong); overflow: hidden; }
  .s-fill { height: 100%; width: calc(7px + var(--f) * (100% - 14px)); background: var(--ink); transition: width 160ms var(--ease); }
  .s-thumb {
    position: absolute; top: 50%; left: calc(var(--f) * (100% - 14px)); width: 14px; height: 14px; margin-top: -7px;
    border-radius: 50%; background: var(--ink); transition: transform 120ms var(--ease), left 160ms var(--ease);
  }
  .slider:hover .s-thumb { transform: scale(1.12); }
  .slider.dragging .s-thumb { transform: scale(.92); }
  .slider:focus-visible .s-thumb { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  .s-val { min-width: 18px; text-align: right; font-size: 13px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }

  .pop { width: min(296px, calc(100vw - 48px)); display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; padding: 8px; overflow: hidden; }
  .pop button {
    width: 100%; min-width: 0; height: 32px; padding: 0; overflow: hidden; border: 0; border-radius: 6px; background: transparent; font-size: 16px; line-height: 1;
    transition: background 100ms ease, transform 100ms ease;
  }
  .pop button:hover { background: var(--hover); }
  .pop button:active { transform: scale(.92); }

  /* ---------- Color picker ---------- */
  .picker {
    width: 244px; padding: 12px; border-radius: 12px;
    transition: opacity 240ms ease, transform var(--side-t) var(--side-ease), left var(--side-t) var(--side-ease), top var(--side-t) var(--side-ease), visibility 0s linear var(--side-t);
  }
  .picker.open { transition-delay: 0s; }
  .sv {
    position: relative; height: 150px; border-radius: 8px; background: hsl(0, 100%, 50%);
    touch-action: none; cursor: crosshair; outline: none;
  }
  .sv::before, .sv::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
  .sv::before { background: linear-gradient(to right, #fff, rgba(255, 255, 255, 0)); }
  .sv::after { background: linear-gradient(to top, #000, rgba(0, 0, 0, 0)); }
  .hue {
    position: relative; height: 12px; margin-top: 14px; border-radius: 6px; touch-action: none; cursor: pointer; outline: none;
    background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
  }
  .pk-thumb {
    position: absolute; z-index: 2; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .4); pointer-events: none;
  }
  .hue .pk-thumb { top: 50%; }
  .sv:focus-visible .pk-thumb, .hue:focus-visible .pk-thumb { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  .pk-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .pk-swatch { width: 28px; height: 28px; flex: none; border-radius: 8px; border: 1px solid var(--line-strong); }
  /* Looks like a button; turns into a text field on hover or focus */
  .pk-hex {
    flex: 1; min-width: 0; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--hover); color: var(--ink); font-size: 13px; font-weight: 500; letter-spacing: .04em; text-align: center;
    text-transform: uppercase; font-variant-numeric: tabular-nums; outline: none; cursor: pointer;
    transition: background 200ms ease, border-color 200ms ease, text-align 0s, letter-spacing 200ms ease;
  }
  .pk-hex:hover { border-color: var(--line-strong); background: var(--bg); cursor: text; }
  .pk-hex:focus { border-color: var(--muted); background: var(--bg); cursor: text; letter-spacing: .08em; }

  /* ---------- Title editor and preview ----------

<script>
(function () {
  var FONTS = ['Archivo Black', 'Anton', 'Bebas Neue', 'Bangers', 'Staatliches', 'Righteous', 'Rubik Mono One', 'Oswald', 'Montserrat', 'Poppins', 'Hanken Grotesk', 'Playfair Display', 'DM Serif Display', 'Lobster', 'Pacifico', 'Permanent Marker', 'Caveat', 'Space Mono'];
  var EMOJIS = ['🏆','🥇','🥈','🥉','🔥','⭐','👑','💎','🎯','🚀','🎬','🎮','🎵','📚','⚽','🍕','😂','😍','😎','🤯','😱','💀','👻','❤️','💯','✅','⚡','🌟','🎉','🍿','🌍','💥'];
  var STROKE_MAX = 20;
  var CANVAS_W = 1080, CANVAS_PAD = 72;
  var SW = '-webkit-text-stroke-width', SC = '-webkit-text-stroke-color';
  // The stroke is painted behind the fill, so only its outer half shows. Doubling keeps the slider value equal to the visible width.
  function sw(v) { return (v * 0.02) + 'em'; }

  var state = { font: 'Archivo Black', size: 70, bold: false, italic: false, strike: false, align: 'center', color: '#ffffff', stroke: 0, strokeColor: '#ffffff' };
  var bgColor = '#000000';
  var bgOn = true;
  var rs = { size: 100, gap: 20, top: 90, tgap: 20, stroke: 3, strokeColor: '#000000', incl: true };
  var wasEmpty = true;
  var LOCAL = ['-webkit-text-stroke-width', '-webkit-text-stroke-color', 'color', 'font-size', 'font-family', 'font-weight', 'font-style', 'text-decoration', 'text-decoration-line'];

  var $ = function (s) { return document.querySelector(s); };
  var editor = $('#title-editor');
  var prev = $('#title-preview');
  var lastRange = null;   // last selected range inside the editor
  var liveSpan = null;    // span that is currently being adjusted live (size, color, stroke)

  /* ---------- Copy protection: only input fields can be selected and copied ---------- */
  function editable(el) { return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable); }
  ['copy', 'cut'].forEach(function (n) {
    document.addEventListener(n, function (e) { if (!editable(document.activeElement)) e.preventDefault(); });
  });
  document.addEventListener('contextmenu', function (e) { if (!e.target.closest('.editor, input')) e.preventDefault(); });
  document.addEventListener('dragstart', function (e) { if (!e.target.closest || !e.target.closest('.editor, input')) e.preventDefault(); });

  /* ---------- Lucide icons ---------- */
  function pascal(n) { return n.replace(/(^|-)(\w)/g, function (_, __, c) { return c.toUpperCase(); }); }
  function hasIcon(n) { return !!(window.lucide && window.lucide.icons && window.lucide.icons[pascal(n)]); }
  // Ranking icon: list-sort-descending (Lucide 1.19+). If missing in the loaded version, a similar Lucide icon is used.
  if (window.lucide && window.lucide.icons && !hasIcon('list-sort-descending')) {
    var alt = ['arrow-down-wide-narrow', 'list-ordered'].filter(hasIcon)[0];
    if (alt) $('#rank-icon').setAttribute('data-lucide', alt);
  }
  function iconsNow() { if (window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 1.75 } }); }

  /* ---------- Sidebar ---------- */
  var side = $('#side');
  var toggle = $('#side-toggle');
  function setCollapsed(c) {
    side.classList.toggle('collapsed', c);
    var label = c ? 'Expand menu' : 'Collapse menu';
    toggle.setAttribute('aria-label', label);
    toggle.setAttribute('data-tip', label);
    toggle.setAttribute('aria-expanded', String(!c));
    try { localStorage.setItem('inter-side', c ? '1' : '0'); } catch (e) {}
  }
  var startCollapsed = window.innerWidth < 720;
  try { var saved = localStorage.getItem('inter-side'); if (saved !== null && window.innerWidth >= 720) startCollapsed = saved === '1'; } catch (e) {}
  if (startCollapsed) setCollapsed(true);
  toggle.addEventListener('click', function () { setCollapsed(!side.classList.contains('collapsed')); });

  var ind = $('#nav-ind');
  function placeIndicator() {
    var t = document.querySelector('.tab[aria-current="page"]');
    if (t) ind.style.transform = 'translateY(' + (t.offsetTop + (t.offsetHeight - 16) / 2) + 'px)';
  }
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (o) { o.removeAttribute('aria-current'); });
      t.setAttribute('aria-current', 'page');
      placeIndicator();
    });
  });

  /* ---------- Preview (Shorts, 9:16) and editor scale ---------- */
  var stage = $('#stage'), canvas = $('#canvas');
  function fit() { canvas.style.transform = 'scale(' + (stage.clientWidth / CANVAS_W) + ')'; }
  // The editor's px unit follows its width, so line breaks match the preview exactly
  var EDITOR_SCALE = .62; // the input text is shown clearly smaller than in the preview
  function fitEditor() {
    var w = editor.clientWidth - 36;
    if (w > 0) editor.style.setProperty('--u', (w / (CANVAS_W - CANVAS_PAD * 2) * EDITOR_SCALE) + 'px');
  }
  fit(); fitEditor();
  if (window.ResizeObserver) {
    new ResizeObserver(fit).observe(stage);
    new ResizeObserver(fitEditor).observe(editor);
  } else {
    window.addEventListener('resize', function () { fit(); fitEditor(); });
  }

  /* ---------- Helpers ---------- */
  function cleanup() {
    editor.querySelectorAll('span').forEach(function (sp) {
      var st = sp.getAttribute('style');
      if (!st || !st.trim()) {
        while (sp.firstChild) sp.parentNode.insertBefore(sp.firstChild, sp);
        sp.remove();
      }
    });
  }
  // A setting applied to the whole title replaces local overrides inside the text
  function strip(props) {
    editor.querySelectorAll('[style]').forEach(function (el) {
      props.forEach(function (p) { el.style.removeProperty(p); });
    });
    cleanup();
    liveSpan = null;
  }

  var sizeInput = $('#size');
  var slider = $('#stroke-slider');
  var strokeVal = 0;

  function setSliderUI(v) {
    strokeVal = v;
    slider.style.setProperty('--f', v / STROKE_MAX);
    slider.setAttribute('aria-valuenow', String(v));
    $('#stroke-val').textContent = v;
  }
  function syncControls() {
    sizeInput.value = state.size;
    setSliderUI(state.stroke);
    if (pk.open) loadTarget();
  }

  function applyGlobal() {
    [editor, prev].forEach(function (el) {
      el.style.fontFamily = "'" + state.font + "', sans-serif";
      el.style.fontSize = 'calc(' + state.size + ' * var(--u))';
      el.style.fontWeight = state.bold ? '700' : '400';
      el.style.fontStyle = state.italic ? 'italic' : 'normal';
      el.style.textDecoration = state.strike ? 'line-through' : 'none';
      el.style.textAlign = state.align;
      el.style.color = state.color;
      el.style.setProperty(SW, sw(state.stroke));
      el.style.setProperty(SC, state.strokeColor);
    });
    $('#font-label').textContent = state.font;
    $('#font-label').style.fontFamily = "'" + state.font + "', sans-serif";
    $('#seg-ind').style.transform = 'translateX(' + (['left', 'center', 'right'].indexOf(state.align) * 32) + 'px)';
    document.querySelectorAll('[data-align]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.align === state.align));
    });
    markFont();
    refreshToggles();
    sync();
  }

  function sync() {
    var empty = editor.textContent === '';
    if (empty) { editor.innerHTML = ''; lastRange = null; liveSpan = null; }
    else if (wasEmpty && !restoring) {
      editor.querySelectorAll('[style]').forEach(function (el) { LOCAL.forEach(function (p) { el.style.removeProperty(p); }); });
    }
    wasEmpty = empty;
    prev.innerHTML = editor.innerHTML;
    scheduleCommit();
  }

  /* ---------- Undo / redo (title only) ---------- */
  var hist = [], hi = -1, commitTimer = null, restoring = false;
  var undoBtn = $('#b-undo'), redoBtn = $('#b-redo');
  function snap() { return JSON.stringify({ h: editor.innerHTML, s: state }); }
  function updateHistBtns() {
    undoBtn.disabled = !(hi > 0 || commitTimer !== null);
    redoBtn.disabled = commitTimer !== null || hi >= hist.length - 1;
  }
  function commitNow() {
    clearTimeout(commitTimer); commitTimer = null;
    if (restoring) return;
    var s = snap();
    if (hist[hi] !== s) {
      hist = hist.slice(0, hi + 1);
      hist.push(s);
      if (hist.length > 200) hist.shift();
      hi = hist.length - 1;
    }
    updateHistBtns();
  }
  function scheduleCommit() {
    if (restoring) return;
    clearTimeout(commitTimer);
    commitTimer = setTimeout(commitNow, 450);
    updateHistBtns();
  }
  function loadSnap(str) {
    var o = JSON.parse(str);
    restoring = true;
    Object.assign(state, o.s);
    editor.innerHTML = o.h;
    lastRange = null; liveSpan = null;
    applyGlobal();
    syncControls();
    restoring = false;
    updateHistBtns();
    paintSel();
  }
  function undo() { commitNow(); if (hi <= 0) return; hi--; loadSnap(hist[hi]); }
  function redo() { if (commitTimer !== null || hi >= hist.length - 1) return; hi++; loadSnap(hist[hi]); }
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  /* ---------- Remember, show and restore the selection ---------- */
  function partial() { return !!lastRange && !lastRange.collapsed && editor.contains(lastRange.commonAncestorContainer); }

  // While the editor is not focused, the selection stays visible through a highlight
  function paintSel() {
    if (!window.CSS || !CSS.highlights || typeof Highlight === 'undefined') return;
    if (partial() && document.activeElement !== editor) CSS.highlights.set('inter-sel', new Highlight(lastRange));
    else CSS.highlights.delete('inter-sel');
  }

  // Pressing a toolbar control (picker, sliders...) must never change what is remembered as selected
  var uiDown = false, uiUntil = 0;
  document.addEventListener('pointerdown', function (e) {
    uiDown = !!(e.target.closest && e.target.closest('.tools, .picker, #emoji-pop') && !e.target.closest('input'));
  }, true);
  function uiRelease() {
    if (!uiDown) return;
    uiDown = false; uiUntil = Date.now() + 350;
    setTimeout(function () {          // bring the visible selection back
      if (partial() && document.activeElement === editor) {
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(lastRange);
      }
    }, 0);
  }
  document.addEventListener('pointerup', uiRelease, true);
  document.addEventListener('pointercancel', uiRelease, true);

  document.addEventListener('selectionchange', function () {
    if (uiDown || Date.now() < uiUntil) return;
    if (document.activeElement !== editor) return;
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var r = sel.getRangeAt(0);
    if (!editor.contains(r.commonAncestorContainer)) return;
    lastRange = r.cloneRange();
    liveSpan = null;
    refreshToggles();
  });
  editor.addEventListener('focus', paintSel);
  editor.addEventListener('blur', function () { setTimeout(paintSel, 0); });

  document.addEventListener('mousedown', function (e) {
    if (!e.target.closest('.tools, .picker, #emoji-pop') && !e.target.closest('.editor')) {
      lastRange = null; liveSpan = null; refreshToggles(); paintSel();
    }
    if (!e.target.closest('#font-dd')) closeFont();
    if (!e.target.closest('#emoji-pop') && !e.target.closest('#emoji-btn') && !e.target.closest('.rk-emoji')) closeEmoji();
    if (!e.target.closest('#picker') && !e.target.closest('.color-btn')) closePicker();
  });

  function restore() {
    editor.focus({ preventScroll: true });
    var sel = window.getSelection();
    sel.removeAllRanges();
    if (lastRange) {
      sel.addRange(lastRange);
    } else {
      var r = document.createRange();
      r.selectNodeContents(editor);
      r.collapse(false);
      sel.addRange(r);
      lastRange = r.cloneRange();
    }
  }

  // Apply a style to the selected part only (the editor does not need focus)
  function wrapSelection(styles, select) {
    if (liveSpan && editor.contains(liveSpan)) {
      Object.keys(styles).forEach(function (k) { liveSpan.style.setProperty(k, styles[k]); });
      sync();
      return;
    }
    var r = lastRange.cloneRange();
    var host = r.commonAncestorContainer;
    if (host.nodeType === 1 && host !== editor && host.tagName === 'SPAN' && r.startContainer === host && r.startOffset === 0 && r.endOffset === host.childNodes.length) {
      Object.keys(styles).forEach(function (k) { host.style.setProperty(k, styles[k]); });
      liveSpan = host;
      if (select) restore();
      liveSpan = host;
      sync(); paintSel();
      return;
    }
    var span = document.createElement('span');
    Object.keys(styles).forEach(function (k) { span.style.setProperty(k, styles[k]); });
    span.appendChild(r.extractContents());
    r.insertNode(span);
    span.querySelectorAll('[style]').forEach(function (el) {
      Object.keys(styles).forEach(function (k) { el.style.removeProperty(k); });
    });
    r.selectNodeContents(span);
    lastRange = r;
    liveSpan = span;
    if (select) { restore(); liveSpan = span; }
    sync();
    paintSel();
  }

  /* ---------- Bold / italic / strikethrough ---------- */
  var btns = { bold: $('#b-bold'), italic: $('#b-italic'), strike: $('#b-strike') };
  function refreshToggles() {
    var b = state.bold, i = state.italic, s = state.strike;
    if (partial() && document.activeElement === editor) {
      try {
        b = document.queryCommandState('bold');
        i = document.queryCommandState('italic');
        s = document.queryCommandState('strikeThrough');
      } catch (e) {}
    }
    btns.bold.setAttribute('aria-pressed', String(b));
    btns.italic.setAttribute('aria-pressed', String(i));
    btns.strike.setAttribute('aria-pressed', String(s));
  }
  function toggleFmt(cmd, key, props) {
    if (partial()) {
      restore();
      document.execCommand('styleWithCSS', false, true);
      document.execCommand(cmd);
      sync();
      refreshToggles();
    } else {
      state[key] = !state[key];
      strip(props);
      applyGlobal();
    }
  }
  // Buttons do not take focus from the editor, so the selection stays
  document.querySelectorAll('.tools button').forEach(function (b) {
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
  });
  btns.bold.addEventListener('click', function () { toggleFmt('bold', 'bold', ['font-weight']); });
  btns.italic.addEventListener('click', function () { toggleFmt('italic', 'italic', ['font-style']); });
  btns.strike.addEventListener('click', function () { toggleFmt('strikeThrough', 'strike', ['text-decoration', 'text-decoration-line']); });

  /* ---------- Alignment (always the whole title) ---------- */
  document.querySelectorAll('[data-align]').forEach(function (b) {
    b.addEventListener('click', function () {
      var order = ['left', 'center', 'right'], dir = order.indexOf(b.dataset.align) - order.indexOf(state.align);
      if (!dir) return;
      state.align = b.dataset.align; applyGlobal();
      // the text glides in from the side it came from
      [[editor, 18], [prev, 80]].forEach(function (p) {
        if (!p[0].animate) return;
        p[0].animate([{ opacity: .3, transform: 'translateX(' + (-Math.sign(dir) * p[1]) + 'px)' }, { opacity: 1, transform: 'none' }],
          { duration: 520, easing: 'cubic-bezier(.22, 1, .36, 1)' });
      });
    });
  });

  /* ---------- Font ---------- */
  var fontBtn = $('#font-btn'), fontPanel = $('#font-panel');
  function closeFont() { fontPanel.classList.remove('open'); fontBtn.setAttribute('aria-expanded', 'false'); }
  function markFont() {
    fontPanel.querySelectorAll('.dd-item').forEach(function (it) {
      it.setAttribute('aria-selected', String(it.dataset.font === state.font));
    });
  }
  FONTS.forEach(function (f, idx) {
    var it = document.createElement('button');
    it.type = 'button';
    it.className = 'dd-item';
    it.dataset.font = f;
    it.style.setProperty('--i', idx);
    it.setAttribute('role', 'option');
    var name = document.createElement('span');
    name.style.fontFamily = "'" + f + "', sans-serif";

        rPush();
      }
      document.addEventListener('pointermove', move); document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
    });
  }

  /* ---------- Videos: link / TikTok / upload and the preview player ---------- */
  // TikTok links are resolved through this API (returns {code:0, data:{play, hdplay, author}}). Swap in your own backend here if you have one.
  var TIKTOK_API = 'https://www.tikwm.com/api/';
  var HDR_PAD = 44;   // header area reaches this far (canvas px) below the title text
  var media = {}, activeId = null, vol = 1, muted = false, tickOn = false;
  var hdrBg = $('#hdr-bg'), vidLayer = $('#vid-layer');
  var plPlay = $('#pl-play'), plPlayIco = plPlay.querySelector('.ico2');
  var plMute = $('#pl-mute'), plMuteIco = plMute.querySelector('.ico2');
  var plTime = $('#pl-time'), plRank = $('#pl-rank');

  function layoutStage() {
    if (!hdrBg) return;
    var hb = Math.min(1200, Math.round(prev.offsetTop + prev.offsetHeight + HDR_PAD));
    canvas.style.setProperty('--hh', hb + 'px');
    canvas.style.setProperty('--vt', hb + 'px');
  }

  /* slider (same look as the settings sliders) that works with fractions 0..1 */
  function mkBar(host, fn, step) {
    host.innerHTML = '<div class="slider" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100"><div class="s-track"><div class="s-fill"></div></div><div class="s-thumb"></div></div>';
    var sl = host.firstChild, drag = false, cur = 0;
    function paint(f) { cur = f; sl.style.setProperty('--f', f); sl.setAttribute('aria-valuenow', Math.round(f * 100)); }
    function at(cx) { var b = sl.getBoundingClientRect(); var f = Math.max(0, Math.min(1, (cx - b.left - 7) / (b.width - 14))); paint(f); fn(f); }
    sl.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 || sl.classList.contains('off')) return;
      e.preventDefault(); sl.setPointerCapture(e.pointerId); drag = true; sl.classList.add('dragging'); at(e.clientX);
    });
    sl.addEventListener('pointermove', function (e) { if (drag) at(e.clientX); });
    ['pointerup', 'pointercancel'].forEach(function (n) { sl.addEventListener(n, function () { drag = false; sl.classList.remove('dragging'); }); });
    sl.addEventListener('keydown', function (e) {
      var d = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[e.key];
      if (!d) return;
      e.preventDefault(); var f = Math.max(0, Math.min(1, cur + d * (step ? step() : .05))); paint(f); fn(f);
    });
    return {
      set: function (f) { if (!drag) paint(f); },
      off: function (b) { sl.classList.toggle('off', b); sl.tabIndex = b ? -1 : 0; }
    };
  }

  function fmt(t) { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2); }
  function actVid() { var m = media[activeId]; return (m && m.status === 'ready' && m.v && rankById(activeId)) ? m.v : null; }

  var seekBar = mkBar($('#pl-seek'), function (f) {
    var v = actVid(); if (v && isFinite(v.duration)) { try { v.currentTime = f * v.duration; } catch (e) {} }
    syncTime();
  }, function () { var v = actVid(); return (v && v.duration) ? 5 / v.duration : .05; });
  var volBar = mkBar($('#pl-vol'), function (f) { vol = f; muted = false; applyVol(); });

  function syncTime() {
    var v = actVid(), d = (v && isFinite(v.duration)) ? v.duration : 0, t = v ? v.currentTime : 0;
    plTime.textContent = fmt(t) + ' / ' + fmt(d);
    seekBar.set(d ? Math.min(1, t / d) : 0);
  }
  function tick() { var v = actVid(); syncTime(); if (v && !v.paused) requestAnimationFrame(tick); else tickOn = false; }
  function startTick() { if (!tickOn) { tickOn = true; requestAnimationFrame(tick); } }
  function syncPlayer() {
    var v = actVid(), playing = !!v && !v.paused, lbl = playing ? 'Pause' : 'Play';
    plPlay.disabled = !v; seekBar.off(!v);
    plPlayIco.dataset.s = playing ? 'pause' : 'play';
    plPlay.setAttribute('aria-label', lbl); plPlay.setAttribute('data-tip', lbl);
    var i = ranks.indexOf(rankById(activeId));
    plRank.textContent = i >= 0 ? 'Rank ' + (i + 1) : '–';
    syncTime(); if (playing) startTick();
  }
  function applyVol() {
    var z = muted || vol === 0;
    Object.keys(media).forEach(function (id) { var m = media[id]; if (m.v) { m.v.volume = vol; m.v.muted = z; } });
    plMuteIco.dataset.s = z ? 'vx' : (vol < .5 ? 'v1' : 'v2');
    var lbl = z ? 'Unmute' : 'Mute';
    plMute.setAttribute('aria-label', lbl); plMute.setAttribute('data-tip', lbl);
    volBar.set(z ? 0 : vol);
  }
  plPlay.addEventListener('click', function () {
    var v = actVid(); if (!v) return;
    if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function () {}); } else v.pause();
  });
  plMute.addEventListener('click', function () {
    if (muted || vol === 0) { muted = false; if (vol === 0) vol = .5; } else muted = true;
    applyVol();
  });

  /* which rank's video the preview shows */
  function fixActive() {
    if (activeId != null && rankById(activeId)) return;
    var withV = ranks.filter(function (r) { var m = media[r.id]; return m && m.status === 'ready'; })[0] || ranks[0];
    activeId = withV ? withV.id : null;
  }
  function showActive() {
    Object.keys(media).forEach(function (id) {
      var m = media[id]; if (!m.v) return;
      var on = String(id) === String(activeId) && !!rankById(id);
      m.v.style.display = on ? 'block' : 'none';
      if (!on) m.v.pause();
    });
  }
  function activate(r) { if (String(activeId) === String(r.id)) return; activeId = r.id; showActive(); syncPlayer(); }

  /* media lifecycle */
  function dropVideo(id) {
    var m = media[id]; if (!m) return;
    clearTimeout(m.to); if (m.ctl) m.ctl.abort();
    var v = m.v; m.v = null;
    if (v) { v.pause(); v.removeAttribute('src'); try { v.load(); } catch (e) {} v.remove(); }
    if (m.blob) URL.revokeObjectURL(m.blob);
    delete media[id];
  }
  function beginMedia(r, props) {
    dropVideo(r.id);
    var m = { id: r.id, status: 'loading', msg: '', label: '', ctl: window.AbortController ? new AbortController() : { abort: function () {}, signal: undefined }, v: null, blob: null, to: 0 };
    Object.keys(props || {}).forEach(function (k) { m[k] = props[k]; });
    media[r.id] = m; renderMedia(r.id);
    return m;
  }
  function renderMedia(id) {
    var r = rankById(id), m = media[id];
    if (r) {
      var row = r.el.querySelector('.rk-media');
      if (!m) row.hidden = true;
      else {
        row.hidden = false;
        row.querySelector('.ico2').dataset.s = m.status === 'loading' ? 'load' : m.status === 'ready' ? 'ok' : 'err';
        row.querySelector('.rk-mt').textContent = m.msg || m.label || '';
        row.classList.toggle('err', m.status === 'error');
      }
    }
    showActive(); syncPlayer();
  }
  function fail(m, msg) {
    if (media[m.id] !== m) return;
    clearTimeout(m.to);
    var v = m.v; m.v = null;
    if (v) { v.pause(); v.removeAttribute('src'); try { v.load(); } catch (e) {} v.remove(); }
    m.status = 'error'; m.msg = msg; renderMedia(m.id);
  }
  function mkVideo(m) {
    var v = document.createElement('video');
    v.className = 'rk-vid'; v.loop = true; v.preload = 'auto'; v.controls = false; v.playsInline = true;
    v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
    v.disablePictureInPicture = true; v.disableRemotePlayback = true;
    v.volume = vol; v.muted = muted || vol === 0;
    ['play', 'pause', 'loadedmetadata', 'durationchange', 'seeked'].forEach(function (n) {
      v.addEventListener(n, function () { if (media[activeId] === m) syncPlayer(); });
    });
    v.addEventListener('timeupdate', function () { if (media[activeId] === m && !tickOn) syncTime(); });
    v.addEventListener('error', function () {
      if (m.v !== v) return;
      fail(m, m.kind === 'file' ? "This file can't be played in the browser" : "Couldn't load a video from this link (TikTok and direct video links work)");
    });
    vidLayer.appendChild(v);
    return v;
  }
  function attachVideo(m, src) {
    var v = mkVideo(m); m.v = v; m.src = src;
    m.to = setTimeout(function () { fail(m, 'The video took too long to load'); }, 30000);
    v.addEventListener('loadedmetadata', function () {
      if (media[m.id] !== m || m.v !== v) return;
      clearTimeout(m.to);
      try { v.currentTime = 0.001; } catch (e) {}   // shows the first frame (also on iOS)
      m.status = 'ready'; m.msg = ''; activeId = m.id;
      renderMedia(m.id);
    }, { once: true });
    v.src = src;
    try { v.load(); } catch (e) {}
  }

  /* TikTok: resolve the link, download the file, play it from memory */
  async function resolveTikTok(url, signal) {
    for (var i = 0; i < 3; i++) {
      var res = await fetch(TIKTOK_API + '?hd=1&url=' + encodeURIComponent(url), { signal: signal });
      var j = await res.json();
      if (j && j.code === 0 && j.data) return j.data;
      if (j && /limit/i.test(String(j.msg || '')) && i < 2) { await new Promise(function (ok) { setTimeout(ok, 1300); }); continue; }
      throw new Error(j && j.msg ? String(j.msg) : 'TikTok video not found');
    }
  }
  async function download(m, remote) {
    var res = await fetch(remote, { signal: m.ctl.signal });
    if (!res.ok) throw new Error('Download failed');
    var total = +res.headers.get('content-length') || 0, type = res.headers.get('content-type') || 'video/mp4', blob;
    if (res.body && res.body.getReader && total) {
      var rd = res.body.getReader(), parts = [], got = 0;
      for (;;) {
        var x = await rd.read(); if (x.done) break;
        parts.push(x.value); got += x.value.length;
        if (media[m.id] !== m) { rd.cancel(); return null; }
        m.msg = 'Downloading… ' + Math.min(99, Math.round(got / total * 100)) + '%'; renderMedia(m.id);
      }
      blob = new Blob(parts, { type: type });
    } else blob = await res.blob();
    return URL.createObjectURL(blob);
  }
  async function loadTikTok(m, url) {
    try {
      m.msg = 'Fetching TikTok…'; renderMedia(m.id);
      var d = await resolveTikTok(url, m.ctl.signal);
      if (media[m.id] !== m) return;
      var remote = d.hdplay || d.play;
      if (!remote) throw new Error('This TikTok has no video (photo post?)');
      if (remote.charAt(0) === '/') remote = 'https://www.tikwm.com' + remote;
      m.label = (d.author && d.author.unique_id) ? '@' + d.author.unique_id : 'TikTok video';
      m.msg = 'Downloading…'; renderMedia(m.id);
      var local = null;
      try { local = await download(m, remote); } catch (e) { if (e && e.name === 'AbortError') return; local = null; }   // no CORS on the file: stream it directly
      if (media[m.id] !== m) { if (local) URL.revokeObjectURL(local); return; }
      if (local) m.blob = local;
      m.msg = ''; attachVideo(m, local || remote);
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      fail(m, e instanceof TypeError ? "Can't reach the TikTok service (offline or blocked)" : ((e && e.message) || 'Could not load this TikTok'));
    }
  }

  function cleanUrl(s) {
    s = (s || '').trim(); if (!s) return '';
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'https://' + s;
    try { var u = new URL(s); return (/^https?:$/.test(u.protocol) && u.hostname.indexOf('.') > 0) ? u.href : ''; } catch (e) { return ''; }
  }
  function isTikTok(u) { try { return /(^|\.)tiktok\.com$/i.test(new URL(u).hostname); } catch (e) { return false; } }
  function loadFromLink(r) {
    var raw = (r.link || '').trim(), cur = media[r.id];
    if (!raw) { if (cur && cur.kind !== 'file') { dropVideo(r.id); renderMedia(r.id); } return; }
    var url = cleanUrl(raw);
    if (!url) { var e0 = beginMedia(r, { kind: 'link', link: raw }); fail(e0, "This doesn't look like a valid link"); return; }
    if (cur && cur.link === url && cur.status !== 'error') return;
    if (isTikTok(url)) { loadTikTok(beginMedia(r, { kind: 'tiktok', link: url, label: 'TikTok video' }), url); return; }
    var m = beginMedia(r, { kind: 'link', link: url, msg: 'Loading video…' });
    try { m.label = decodeURIComponent(new URL(url).pathname.split('/').pop() || '') || new URL(url).hostname; } catch (e) { m.label = url; }
    attachVideo(m, url);
  }
  function loadFile(r, f) {
    if (!/^video\//.test(f.type) && !/\.(mp4|mov|m4v|webm|mkv|avi|3gp|ogv)$/i.test(f.name)) {
      var e0 = beginMedia(r, { kind: 'file' }); fail(e0, 'That file is not a video'); return;
    }
    var m = beginMedia(r, { kind: 'file', label: f.name, msg: 'Loading…' });
    m.blob = URL.createObjectURL(f);
    attachVideo(m, m.blob);
  }

  /* The header area and the video layer follow the title height */
  applyVol(); syncPlayer();

  function addRank(d, instant) {
    if (ranks.length >= MAXR) return;
    d = d || {};
    var r = { id: d.id || ++rid, color: d.color || '#ffffff', custom: !!d.custom, text: d.text || '', link: d.link || '' }, key = 'rank:' + r.id;
    if (r.id > rid) rid = r.id;
    var wrap = document.createElement('div');
    wrap.className = 'rk-wrap'; wrap.dataset.id = r.id;
    wrap.innerHTML = '<div class="rk-in"><div class="panel on rk-item">' +
      '<div class="bar"><span class="grip" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b></span>' +
      '<span class="bar-lbl rk-name"></span><span class="bar-ctl">' +
      '<button class="ctl sq rk-del" type="button" aria-label="Delete rank"><i data-lucide="trash-2"></i></button>' +
      '<button class="fold-btn" type="button" aria-label="Collapse or expand" aria-expanded="false"><i data-lucide="chevron-down"></i></button></span></div>' +
      '<div class="collapse" aria-hidden="true" inert><div class="collapse-in"><div class="body">' +
      '<div class="rk-trow"><input class="field rk-text" type="text" maxlength="60" placeholder="Rank text..." autocomplete="off" spellcheck="false" aria-label="Rank text">' +
      '<button class="ctl sq rk-emoji" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Insert emoji"><i data-lucide="smile"></i></button></div>' +
      '<div class="rk-row"><input class="field rk-link" type="text" placeholder="Video link" autocomplete="off" spellcheck="false" aria-label="Video link">' +
      '<button class="ctl sq rk-sw color-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Rank color"></button></div>' +
      '<button class="ctl wide rk-up" type="button"><i data-lucide="upload"></i>Upload video</button>' +
      '<input class="rk-file" type="file" accept="video/*" hidden>' +
      '<div class="rk-media" hidden><span class="ico2" data-s="load"><i data-lucide="loader-circle" class="i-load"></i><i data-lucide="film" class="i-ok"></i><i data-lucide="circle-alert" class="i-err"></i></span>' +
      '<span class="rk-mt"></span><button class="ctl sq rk-mx" type="button" aria-label="Remove video" data-tip="Remove video"><i data-lucide="x"></i></button></div>' +
      '</div></div></div></div></div>';
    var el = wrap.querySelector('.rk-item'), txt = el.querySelector('.rk-text'), lnk = el.querySelector('.rk-link');
    txt.value = r.text; lnk.value = r.link;
    r.el = el; r.wrap = wrap;
    r.ov = document.createElement('div');
    r.ov.className = 'rk';
    r.ov.innerHTML = '<span class="rk-n"></span><span class="rk-t"></span>';
    r.ov.lastChild.textContent = r.text;
    rkOv.appendChild(r.ov);
    ranks.push(r);
    colorBtns[key] = el.querySelector('.rk-sw');
    colorBtns[key].addEventListener('click', function () { openPicker(key); });
    txt.addEventListener('input', function () { r.text = txt.value; r.ov.lastChild.textContent = r.text; rPush(); });
    var up = el.querySelector('.rk-up'), fi = el.querySelector('.rk-file');
    function fromLink() { clearTimeout(r.lt); if (lnk.value !== '' || (media[r.id] && media[r.id].kind !== 'file')) loadFromLink(r); }
    lnk.addEventListener('input', function (e) {
      r.link = lnk.value; rPush(); clearTimeout(r.lt);
      r.lt = setTimeout(function () { loadFromLink(r); }, e.inputType === 'insertFromPaste' ? 0 : 700);
    });
    lnk.addEventListener('change', fromLink);
    lnk.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); fromLink(); } });
    up.addEventListener('click', function () { fi.click(); });
    fi.addEventListener('change', function () {
      var f = fi.files && fi.files[0]; fi.value = '';
      if (!f) return;
      clearTimeout(r.lt); r.link = ''; lnk.value = ''; loadFile(r, f); rPush();
    });
    el.querySelector('.rk-mx').addEventListener('click', function () {
      clearTimeout(r.lt); r.link = ''; lnk.value = ''; dropVideo(r.id); renderMedia(r.id); rPush();
    });
    el.addEventListener('pointerdown', function () { activate(r); });
    el.addEventListener('focusin', function () { activate(r); });
    var eb = el.querySelector('.rk-emoji');
    eb.addEventListener('mousedown', function (e) { e.preventDefault(); });
    eb.addEventListener('click', function () { toggleEmoji(eb, txt); });
    el.querySelector('.rk-del').addEventListener('click', function () {
      if (ranks.length <= 1) return;
      if (pk.target === key) closePicker();
      closeEmoji();
      delete colorBtns[key];
      ranks.splice(ranks.indexOf(r), 1);
      wrap.classList.add('leaving'); wrap.classList.remove('in'); r.ov.classList.remove('on');
      renderRanks(); rPush();
      setTimeout(function () { wrap.remove(); r.ov.remove(); }, 380);
    });
    el.querySelector('.bar').addEventListener('click', function (e) {
      if (e.target.closest('.rk-del, .grip')) return;
      foldEl(el, !el.classList.contains('open'));
    });
    bindRankDrag(el.querySelector('.grip'), wrap);
    rkItems.appendChild(wrap);
    iconsNow();
    var show = function () { wrap.classList.add('in'); r.ov.classList.add('on'); foldEl(el, true); };
    if (instant) show(); else requestAnimationFrame(function () { requestAnimationFrame(show); });
    if (activeId == null) activeId = r.id;
    renderMedia(r.id);
    if (!rRest) { applyRankStyle(); renderRanks(); rPush(); }
  }
  rkAdd.addEventListener('click', function () { addRank(); });
  if (window.ResizeObserver) new ResizeObserver(layoutRanks).observe(prev);
  addRank(); rCommit();

  /* ---------- Editor ---------- */
  editor.addEventListener('input', sync);
  editor.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.execCommand('insertLineBreak');
      sync();
      return;
    }
    if (e.ctrlKey || e.metaKey) {
      var k = e.key.toLowerCase();
      if (k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
      else if (k === 'y') { e.preventDefault(); redo(); }
    }
  });
  editor.addEventListener('beforeinput', function (e) {
    if (e.inputType === 'historyUndo') { e.preventDefault(); undo(); }
    else if (e.inputType === 'historyRedo') { e.preventDefault(); redo(); }
  });
  editor.addEventListener('paste', function (e) {
    e.preventDefault();
    var t = (e.clipboardData || window.clipboardData).getData('text').replace(/\r/g, '');
    t.split('\n').forEach(function (line, i) {
      if (i > 0) document.execCommand('insertLineBreak');
      if (line) document.execCommand('insertText', false, line);
    });
    sync();
  });

  var segInd = $('#seg-ind');
  segInd.style.transition = 'none';   // no slide on first paint
  iconsNow();
  applyGlobal();
  syncControls();
  void segInd.offsetWidth;
  segInd.style.transition = '';
  commitNow();
  placeIndicator();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { placeIndicator(); fitEditor(); layoutRanks(); });
})();
